<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
<title id="title">TimeMachine implemented architecture</title>
<desc id="description">The Express SDK sends incidents to the Fastify collector. Browsers use the Next.js dashboard, which calls the collector. The collector owns PostgreSQL persistence and alert delivery, reads trusted replay registry files, and runs isolated Docker replays. A build machine creates images and registry metadata. Private image backup and recovery are optional.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#276344"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#17251d}.title{font-size:32px;font-weight:700}.heading{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#627269}.label{font-size:16px;fill:#276344}.boundary{fill:#fafcfb;stroke:#d6e2d9;stroke-width:1.5;stroke-dasharray:7 5}.box{fill:white;stroke:#cddad1;stroke-width:1.5}.green{fill:#eef6f0;stroke:#a8c8b2;stroke-width:1.5}.edge{fill:none;stroke:#276344;stroke-width:2;marker-end:url(#arrow)}.optional{stroke-dasharray:6 5}.both{marker-start:url(#arrow)}</style>
<rect width="1600" height="1120" fill="white"/>
<text x="40" y="45" class="title">TimeMachine · implemented architecture</text>
<text x="40" y="78" class="small">Solid connections: runtime data paths · Dashed connections: build/deployment or optional backup</text>

