<text x="54" y="695" class="label">SDK → collector: POST /v1/incidents</text>
<text x="54" y="724" class="small">Project token · HTTPS in remote deployments</text>

<rect x="450" y="711" width="305" height="126" rx="6" class="box"/>
<text x="472" y="745" class="heading">PostgreSQL · IncidentStore</text>
<text x="472" y="777" class="body">Incidents · issues · replay runs</text>
<text x="472" y="808" class="small">Accounts · settings · alert outbox</text>
<path d="M600 614V710" class="edge both"/>
<text x="615" y="667" class="label">Storage adapter / SQL</text>
<rect x="785" y="711" width="255" height="126" rx="6" class="box"/>
<text x="805" y="745" class="heading">Trusted registry JSON</text>
<text x="805" y="778" class="body">Image IDs + scenario contracts</text>
<text x="805" y="809" class="small">Optional backup digests</text>
<path d="M912 710V614" class="edge"/>
<text x="926" y="650" class="small">Validate</text><text x="926" y="674" class="small">and reload</text>

<rect x="1140" y="244" width="420" height="123" rx="6" class="box"/>
