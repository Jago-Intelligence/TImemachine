<text x="80" y="374" class="small">Bounded in-memory delivery queue</text>
<rect x="60" y="491" width="285" height="125" rx="6" class="box"/>
<text x="80" y="525" class="heading">Application dependencies</text>
<text x="80" y="561" class="body">HTTP · databases · queues</text>
<text x="80" y="588" class="small">Supported operations only</text>
<path d="M200 403V490" class="edge both"/>
<text x="215" y="454" class="small">Live app traffic</text>

<rect x="410" y="185" width="680" height="675" rx="8" class="boundary"/>
<text x="430" y="216" class="heading">Shared workspace · your infrastructure</text>
<rect x="450" y="104" width="295" height="55" rx="6" class="box"/>
<text x="472" y="139" class="heading">Developer browser</text>
<rect x="450" y="244" width="330" height="123" rx="6" class="box"/>
<text x="472" y="278" class="heading">Next.js dashboard</text>
<text x="472" y="312" class="body">Issues · replay · workspace · alerts</text>
<text x="472" y="342" class="small">Server-side API requests</text>
<path d="M610 160V243" class="edge both"/>
<text x="624" y="181" class="label">HTTPS + session cookie</text>

<rect x="450" y="455" width="590" height="158" rx="6" class="green"/>
<text x="472" y="490" class="heading">Fastify collector</text>
<text x="472" y="526" class="body">Auth · validation · sanitization · issue grouping</text>
<text x="472" y="559" class="body">Replay coordinator + in-process alert worker</text>
<text x="472" y="591" class="small">Health · rate limits · graceful shutdown</text>
<path d="M610 368V454" class="edge both"/>
<text x="625" y="415" class="label">Authenticated /v1 API</text>
