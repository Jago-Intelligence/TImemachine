<text x="1162" y="341" class="body">Email via SMTP</text>
<path d="M1041 489H1105V305H1139" class="edge"/>
<text x="1158" y="402" class="label">New / reopened issues · independent retries</text>

<rect x="1140" y="455" width="420" height="405" rx="8" class="boundary"/>
<text x="1160" y="486" class="heading">Replay execution</text>
<text x="1160" y="514" class="small">Same host or configured Docker host</text>
<rect x="1160" y="544" width="380" height="81" rx="6" class="box"/>
<text x="1182" y="577" class="heading">Docker engine</text>
<text x="1182" y="606" class="small">Starts trusted image · receives JSON result</text>
<path d="M1041 582H1159" class="edge both"/>
<rect x="1160" y="690" width="380" height="146" rx="6" class="green"/>
<text x="1182" y="724" class="heading">Disposable replay container</text>
<text x="1182" y="757" class="body">App factory + controlled dependencies</text>
<text x="1182" y="790" class="body">Optional in-container synthetic PostgreSQL</text>
<text x="1182" y="818" class="small">No network · read-only root · non-root · limits</text>
<path d="M1345 626V689" class="edge both"/>
<text x="1359" y="665" class="small">stdin / stdout</text>

<rect x="40" y="924" width="650" height="119" rx="6" class="box"/>
<text x="62" y="958" class="heading">Developer / CI build machine</text>
<text x="62" y="993" class="body">SDK CLI + replay CLI → Docker build + validated manifest</text>
<text x="62" y="1022" class="small">Updates app artifact ID; deploy registry JSON to collector separately</text>
<path d="M640 924V888H912V838" class="edge optional"/>
<text x="710" y="907" class="label">Deploy trusted metadata</text>
<rect x="970" y="924" width="590" height="119" rx="6" class="box"/>
<text x="992" y="958" class="heading">Optional private container registry</text>
<text x="992" y="993" class="body">Immutable image digests · Docker-managed credentials</text>
<text x="992" y="1022" class="small">Recovery verifies restored image ID; not incident storage</text>
<path d="M691 989H969" class="edge optional"/>
<text x="733" y="978" class="label">Optional push</text>
<path d="M1515 923V861H1580V586H1541" class="edge optional"/>
<text x="1165" y="893" class="label">Optional digest pull + identity verification</text>
<text x="40" y="1090" class="small">No separate worker service, Redis queue, AI service or test-generation package is required or implemented here.</text>
</svg>
