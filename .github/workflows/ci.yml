name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: timemachine
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timemachine -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm check
        env:
          TURBO_TELEMETRY_DISABLED: '1'
      - run: pnpm test:storage
        env:
          TEST_DATABASE_URL: postgresql://timemachine:integration-test-only@127.0.0.1:5432/postgres
      - run: pnpm smoke:dashboard
      - run: pnpm smoke:projects
