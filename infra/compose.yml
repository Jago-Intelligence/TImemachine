services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: timemachine
      POSTGRES_DB: timemachine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm db:setup first}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U timemachine -d timemachine']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
